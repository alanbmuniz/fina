# railway.toml — Configuração de deploy no Railway
# Documentação: https://docs.railway.app

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "fina-api"

  [services.variables]
  PORT = "8000"
  # As demais variáveis são configuradas no painel do Railway:
  # DATABASE_URL, REDIS_URL, SECRET_KEY, ANTHROPIC_API_KEY,
  # PLUGGY_CLIENT_ID, PLUGGY_CLIENT_SECRET, ENCRYPTION_KEY